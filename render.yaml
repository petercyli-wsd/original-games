# Render Blueprint. New → Blueprint in Render and pick this repo.
#   original-games  static site: the lobby + every game
#   originals-api   tiny Node service for game star ratings
# Ratings live in any Postgres; we use Neon's free tier (doesn't expire).
services:
  - type: web
    name: original-games
    runtime: static
    buildCommand: npm ci && npm run typecheck && npm test && npm run build
    staticPublishPath: ./apps/platform/dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # Set to "true" to list template games in production.
      - key: VITE_SHOW_TEMPLATES
        value: "false"
      # The API's URL, e.g. https://originals-api.onrender.com. Render asks for
      # it when the Blueprint is created; leave it empty to hide ratings.
      - key: VITE_RATINGS_API_URL
        sync: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Client-side routing: /play/<id> is served by index.html.
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: originals-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w @originals/api
    startCommand: npm run start -w @originals/api
    healthCheckPath: /health
    # Game-only changes don't redeploy the API.
    buildFilter:
      paths:
        - apps/api/**
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # Neon connection string (includes ?sslmode=require). Render asks for it
      # when the Blueprint is created; it's a secret, so never commit it.
      - key: DATABASE_URL
        sync: false
      # "*" allows any site to read and post ratings. Tighten to your site's
      # URL (comma-separated list) once you know it.
      - key: CORS_ORIGINS
        value: "*"
